name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "Makefile"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "Makefile"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-validate:
    name: Backend Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      POSTGRES_PASSWORD_FILE: ${{ runner.temp }}/postgres_password

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Create postgres password file
        run: |
          umask 077
          printf '%s' 'test' > "$POSTGRES_PASSWORD_FILE"

      - name: Run backend validation
        env:
          POSTGRES_USER: test
          POSTGRES_DB: test
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          OPENAI_API_KEY: test-api-key
        run: make backend-validate

